<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Inquiry Manager</title>
  <link rel="icon" href="data:,">
  <meta name="description" content="Log customer inquiries, set priority, assign them and track status.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body data-view="list">
  <a class="skip" href="#main">Skip to main content</a>
  <header class="appbar">
    <div class="appbar__inner">
      <a class="back" href="#/" aria-label="Back to inquiries"><svg class="icon" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M15 6l-6 6 6 6"/></svg></a>
      <a class="brand" href="#/">Maple Street Goods</a>
      <div class="appbar__title" id="appbarTitle" aria-hidden="true"></div>
      <a class="btn btn--primary add-btn" href="#/new"><svg class="icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M12 5v14M5 12h14"/></svg>Add inquiry</a>
    </div>
  </header>
  <main id="main" class="layout" tabindex="-1">
    <section class="pane list-pane" id="listPane" aria-label="Inquiry list"></section>
    <section class="pane detail-pane" id="detailPane" aria-label="Inquiry form"></section>
  </main>
  <div class="toast" id="toast" aria-hidden="true"><svg class="icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="9"/><path d="M9 12l2 2 4-4"/></svg><span id="toastText"></span></div>
  <div class="sr-only" id="announce" role="status" aria-live="polite"></div>
  <noscript><p style="padding:16px">This app needs JavaScript to run.</p></noscript>
  <script type="module" src="js/app.js"></script>
</body>
</html>
